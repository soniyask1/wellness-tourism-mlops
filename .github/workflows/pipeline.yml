name: Wellness Tourism ML Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'tourism_project/data/**'
      - 'tourism_project/model_building/**'
      - 'tourism_project/deployment/app.py'
      - '**/requirements*.txt'
      - 'tests/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wellness-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '2'
  MPLBACKEND: Agg
  MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: 'false'

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m tourism_project.model_building.data_register
      - uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: |
            tourism_project/data/tourism.csv
            reports/registration.json
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: .
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m tourism_project.model_building.prep
      - uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            artifacts/splits/*.csv
            reports/registration.json
            reports/preparation.json
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .
      - run: python -m pip install -r requirements-ci.txt
      - name: Tune, track all candidates with MLflow and evaluate
        run: python -m tourism_project.model_building.train --require-mlflow
      - name: Require model, quality and Streamlit smoke tests
        env:
          REQUIRE_STREAMLIT: '1'
        run: python -m unittest discover -s tests -v
      - name: Add metrics to run summary
        run: |
          python - <<'PY'
          import json, os
          m=json.load(open('reports/metrics.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('# Holdout evaluation\n\n')
              out.write(f"Model: {m['algorithm']}\n\n")
              for name,value in m['test_metrics'].items():
                  out.write(f'- {name}: {value:.4f}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            tourism_project/deployment/model.joblib
            tourism_project/deployment/metadata.json
            reports/
          if-no-files-found: error
      - name: Preserve MLflow experiment database and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimentation-tracking
          path: |
            artifacts/mlflow.db
            mlruns/
            mlartifacts/
            reports/cv_results.csv
            reports/experiment_trials.json
          retention-days: 30

  publish-model:
    needs: model-training
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refuse to publish a model for an outdated input commit
        env:
          TRAINED_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TRAINED_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: .
      - name: Commit tested model and reports to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tourism_project/deployment/model.joblib tourism_project/deployment/metadata.json reports
          if git diff --cached --quiet; then
            echo 'Model and reports are unchanged.'
          else
            git commit -m 'chore: publish validated tourism model [skip ci]'
            git push origin HEAD:main
          fi
      - run: echo 'Committed model is ready for Streamlit Community Cloud to redeploy.'
